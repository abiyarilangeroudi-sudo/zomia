name: zomia_frontend
description: "Zomia MVP Flutter application."
publish_to: 'none'

version: 1.0.85+86

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Sofia Sans
      fonts:
        - asset: assets/fonts/sofia_sans/sofia-sans-latin-400-normal.ttf
          weight: 400
        - asset: assets/fonts/sofia_sans/sofia-sans-latin-500-normal.ttf
          weight: 500
        - asset: assets/fonts/sofia_sans/sofia-sans-latin-600-normal.ttf
          weight: 600
        - asset: assets/fonts/sofia_sans/sofia-sans-latin-700-normal.ttf
          weight: 700
