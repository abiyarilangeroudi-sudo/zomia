services:
  postgres:
    image: postgres:16-alpine
    container_name: zomia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zomia}
      POSTGRES_USER: ${POSTGRES_USER:-zomia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zomia_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zomia} -d ${POSTGRES_DB:-zomia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

